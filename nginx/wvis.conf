# ==============================================================================
# WinVinaya Infosystems - Production Nginx Server Configuration
# ==============================================================================
# Domain: winvinaya.com (and www.winvinaya.com)
# Frontend: React 19 SPA (TanStack Router) built to /dist
# Backend: Express 5 + Node.js (Port 5000)
# Static Uploads: /backend/uploads (Images, PDFs, Documents)
# ==============================================================================

# Upstream definition for Express Backend API
upstream wvis_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ==============================================================================
# 1. HTTP Server (Port 80) - Redirect all traffic to HTTPS (or serve directly)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name winvinaya.com www.winvinaya.com;

    # Let's Encrypt / Certbot ACME Challenge Path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# 2. HTTPS Server (Port 443) - Primary Production Server Block
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name winvinaya.com www.winvinaya.com;

    # ==========================================================================
    # SSL / TLS Configuration (Let's Encrypt / Custom Certificates)
    # ==========================================================================
    # Replace these paths with your actual SSL certificate paths (e.g. from Certbot)
    ssl_certificate /etc/letsencrypt/live/winvinaya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winvinaya.com/privkey.pem;
    
    # Modern SSL security protocols & ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # SSL Session Caching for faster handshakes
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ==========================================================================
    # Root Directory & Document Settings
    # ==========================================================================
    # Point this to your frontend production build folder
    root /var/www/wvis/frontend/dist;
    index index.html;

    # Hide Nginx version for security
    server_tokens off;

    # Maximum upload size (Allows PDF/eBook/Doc uploads up to 25MB + form overhead)
    client_max_body_size 35M;

    # Buffer & Timeout settings
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 65s;

    # ==========================================================================
    # Security Headers
    # ==========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ==========================================================================
    # Gzip Compression Optimization
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        font/woff
        font/woff2;

    # ==========================================================================
    # 1. API Reverse Proxy -> Express Backend (/api/)
    # ==========================================================================
    location /api/ {
        proxy_pass http://wvis_backend;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real Client IP and Host headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable proxy buffering for real-time API responses
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        # Timeout configuration
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==========================================================================
    # 2. Static Media & Document Uploads (/uploads/)
    # ==========================================================================
    # Serves uploaded blog images, newsletter PDFs, and eBooks directly from disk
    location /uploads/ {
        alias /var/www/wvis/backend/uploads/;
        
        # Cache uploaded media in browsers for 30 days
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        
        # Security: Prevent executing scripts from uploads directory
        location ~* \.(php|pl|py|jsp|asp|sh|cgi|exe)$ {
            deny all;
        }

        try_files $uri =404;
    }

    # ==========================================================================
    # 3. Static Assets Caching (Vite Output /assets/)
    # ==========================================================================
    # Vite bundles include content hashes (e.g. index-D7x9qZ.js), so cache immutably for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Media, fonts, and images static cache
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ==========================================================================
    # 4. SEO Special Files
    # ==========================================================================
    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        access_log off;
        log_not_found off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Deny access to hidden/dot files (e.g. .env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================================================================
    # 5. Frontend Single Page Application (SPA) Routing (TanStack Router)
    # ==========================================================================
    # Fallback to index.html for all client-side routes (e.g. /about-us, /services, /admin/*)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Don't cache index.html so users always get updated app version
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }

    # ==========================================================================
    # Logging Configuration
    # ==========================================================================
    access_log /var/log/nginx/wvis_access.log;
    error_log /var/log/nginx/wvis_error.log warn;
}
