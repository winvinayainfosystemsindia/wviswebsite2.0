# ==============================================================================
# WinVinaya Infosystems - HTTP Only (Pre-SSL / Staging / Local Nginx)
# ==============================================================================
# Use this configuration if you haven't setup SSL certificates yet,
# or for staging servers running on plain HTTP on Port 80.
# ==============================================================================

upstream wvis_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name winvinaya.com www.winvinaya.com localhost _;

    # Frontend build directory
    root /var/www/wvis/frontend/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 35M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # 1. API Reverse Proxy
    location /api/ {
        proxy_pass http://wvis_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. Static Media Uploads (/uploads/)
    location /uploads/ {
        alias /var/www/wvis/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 3. Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Media, fonts, images
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 4. SEO files
    location = /robots.txt { access_log off; log_not_found off; try_files $uri =404; }
    location = /sitemap.xml { access_log off; log_not_found off; expires 1d; try_files $uri =404; }
    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }

    # 5. Frontend SPA Client-Side Routing
    location / {
        try_files $uri $uri/ /index.html;

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        }
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/wvis_access.log;
    error_log /var/log/nginx/wvis_error.log warn;
}
